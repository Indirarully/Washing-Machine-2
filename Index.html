<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCADA Monitoring System - Mesin Cuci Industri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes bounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.2,1)}}
    .animate-spin{animation:spin 1s linear infinite}
    .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
    .animate-bounce{animation:bounce 1s infinite}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900">
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const Power = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const Droplets = ({size=24,className=""}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>;
    const Wind = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>;
    const Play = ({size=24}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const Pause = ({size=24}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const AlertCircle = ({size=20,className=""}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const FileText = ({size=48,className=""}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
    const Download = ({size=18}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>;

    const initMachine = id => ({id, status:'idle', waterLevel:0, phase:'idle', timer:0, rpm:0, detergent:false});

    function App() {
      const [machines, setMachines] = useState([1,2,3,4].map(initMachine));
      const [systemStats, setSystemStats] = useState({totalCycles:0, waterUsage:0, activeMachines:0});
      const [reportData, setReportData] = useState([]);
      const [autoMode, setAutoMode] = useState(false);

      useEffect(() => {
        const interval = setInterval(() => {
          setMachines(prev => prev.map(m => {
            if(m.status !== 'running') return m;
            let n = {...m, timer:m.timer+1};
            
            if(m.phase === 'filling' && m.waterLevel < 100) {
              n.waterLevel = Math.min(100, m.waterLevel+2);
              if(n.waterLevel >= 100) {n.phase='washing'; n.timer=0; n.detergent=true;}
            }
            else if(m.phase === 'washing') {
              n.rpm = 400 + Math.sin(m.timer/5)*50;
              if(m.timer >= 60) {n.phase='draining'; n.timer=0; n.rpm=0;}
            }
            else if(m.phase === 'draining') {
              n.waterLevel = Math.max(0, m.waterLevel-3);
              n.detergent = false;
              if(n.waterLevel <= 0) {n.phase='spinning'; n.timer=0;}
            }
            else if(m.phase === 'spinning') {
              n.rpm = Math.min(1200, m.rpm+20);
              if(m.timer >= 45) {
                n.status='complete'; n.phase='complete'; n.rpm=0; n.timer=0;
                setSystemStats(s => ({...s, totalCycles:s.totalCycles+1, waterUsage:s.waterUsage+75}));
                setReportData(p => [...p, {
                  id:p.length+1, machineId:m.id, timestamp:new Date().toLocaleString('id-ID'),
                  waterUsed:75, duration:105, status:'Success'
                }]);
              }
            }
            return n;
          }));
        }, 100);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        setSystemStats(s => ({...s, activeMachines:machines.filter(m=>m.status==='running').length}));
      }, [machines]);

      const updateMachine = (id, updates) => setMachines(p => p.map(m => m.id===id ? {...m,...updates} : m));
      const startMachine = id => updateMachine(id, {status:'running', phase:'filling', waterLevel:0, timer:0, rpm:0, detergent:false});
      const stopMachine = id => updateMachine(id, initMachine(id));

      const phaseConfig = {
        filling: {color:'bg-blue-500', text:'Pengisian Air'},
        washing: {color:'bg-purple-500', text:'Pencucian'},
        draining: {color:'bg-orange-500', text:'Pembuangan'},
        spinning: {color:'bg-green-500', text:'Pengeringan'},
        complete: {color:'bg-gray-500', text:'Selesai'},
        idle: {color:'bg-gray-300', text:'Standby'}
      };

      const exportReport = () => {
        if(reportData.length === 0) return alert('Tidak ada data untuk diekspor');
        const htmlContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Laporan Operasional Mesin Cuci</title><style>body{font-family:Calibri,Arial,sans-serif;margin:40px}h1{color:#2563eb;text-align:center;margin-bottom:5px}h2{color:#64748b;text-align:center;font-size:14px;margin-top:0;margin-bottom:20px}.info{margin:20px 0}.info p{margin:5px 0}table{border-collapse:collapse;width:100%;margin:20px 0}th{background-color:#2563eb;color:white;padding:12px;text-align:left;font-weight:bold;border:1px solid #1e40af}td{padding:10px;border:1px solid #cbd5e1}tr:nth-child(even){background-color:#f8fafc}tr:hover{background-color:#e0f2fe}.success-badge{background-color:#dcfce7;color:#166534;padding:4px 12px;border-radius:12px;font-weight:bold;display:inline-block}.summary{background-color:#f1f5f9;padding:15px;border-radius:8px;margin:20px 0}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:10px}.summary-item{background-color:white;padding:10px;border-radius:6px;border-left:4px solid #2563eb}.summary-label{font-size:12px;color:#64748b;margin-bottom:5px}.summary-value{font-size:20px;font-weight:bold;color:#1e293b}</style></head><body><h1>LAPORAN OPERASIONAL MESIN CUCI</h1><h2>Sistem SCADA Monitoring - 4 Unit Tabung</h2><div class="info"><p><strong>Tanggal Cetak:</strong> ${new Date().toLocaleString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p><p><strong>Total Data:</strong> ${reportData.length} siklus pencucian</p></div><div class="summary"><h3 style="margin-top:0">Ringkasan Operasional</h3><div class="summary-grid"><div class="summary-item"><div class="summary-label">Total Siklus</div><div class="summary-value">${reportData.length}</div></div><div class="summary-item"><div class="summary-label">Total Air (L)</div><div class="summary-value">${reportData.reduce((a,r)=>a+r.waterUsed,0)}</div></div><div class="summary-item"><div class="summary-label">Rata-rata Durasi (s)</div><div class="summary-value">${Math.round(reportData.reduce((a,r)=>a+r.duration,0)/reportData.length)}</div></div><div class="summary-item"><div class="summary-label">Success Rate</div><div class="summary-value">100%</div></div></div></div><h3>Detail Siklus Pencucian</h3><table><thead><tr><th>No</th><th>Mesin</th><th>Waktu Selesai</th><th>Air Digunakan</th><th>Durasi</th><th>Status</th></tr></thead><tbody>${reportData.map((r,i)=>`<tr><td>${i+1}</td><td><strong>Mesin #${r.machineId}</strong></td><td>${r.timestamp}</td><td>${r.waterUsed} Liter</td><td>${r.duration} detik</td><td><span class="success-badge">${r.status}</span></td></tr>`).join('')}</tbody></table><div style="margin-top:40px;padding-top:20px;border-top:2px solid #cbd5e1;font-size:12px;color:#64748b;text-align:center"><p>Dokumen ini dihasilkan secara otomatis oleh Sistem SCADA Monitoring Mesin Cuci</p><p>© ${new Date().getFullYear()} - Sistem Monitoring Industri</p></div></body></html>`;
        const blob = new Blob(['\ufeff', htmlContent], {type:'application/msword'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Laporan-Mesin-Cuci-${new Date().toISOString().split('T')[0]}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert(`File Word berhasil diunduh!\nTotal ${reportData.length} data telah diekspor.`);
      };

      const clearReport = () => {if(confirm('Hapus semua data laporan?')) setReportData([]);};

      useEffect(() => {
        if(!autoMode) return;
        const interval = setInterval(() => {
          setMachines(p => {
            const available = p.find(m => m.status==='idle' || m.status==='complete');
            if(!available) return p;
            return p.map(m => m.id===available.id ? {...m, status:'running', phase:'filling', waterLevel:0, timer:0, rpm:0, detergent:false} : m);
          });
        }, 3000);
        return () => clearInterval(interval);
      }, [autoMode]);

      const StatCard = ({label, value, Icon, gradient}) => (
        <div className={`bg-gradient-to-br ${gradient} rounded-lg p-5 shadow-lg`}>
          <div className="flex items-center justify-between">
            <div><p className="text-sm opacity-80 text-white">{label}</p><p className="text-3xl font-bold text-white">{value}</p></div>
            <Icon/>
          </div>
        </div>
      );

      const MachineCard = ({m}) => (
        <div className="bg-white rounded-xl shadow-2xl overflow-hidden">
          <div className={`${phaseConfig[m.phase].color} p-4 flex justify-between items-center`}>
            <h2 className="text-xl font-bold text-white">Mesin Cuci #{m.id}</h2>
            <span className="bg-white bg-opacity-30 px-3 py-1 rounded-full text-white text-sm font-semibold">{phaseConfig[m.phase].text}</span>
          </div>
          <div className="p-6">
            <div className="mb-6 flex justify-center">
              <div className="relative w-48 h-48">
                <div className="absolute inset-0 bg-gradient-to-br from-gray-300 to-gray-400 rounded-3xl shadow-xl"></div>
                <div className="absolute inset-4 bg-gradient-to-br from-gray-700 to-gray-800 rounded-full shadow-inner"></div>
                <div className="absolute inset-6 bg-gradient-to-br from-blue-100 to-blue-50 rounded-full overflow-hidden border-4 border-gray-600 shadow-lg">
                  <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-blue-400 to-blue-300 transition-all duration-300" style={{height:`${m.waterLevel}%`}}>
                    <div className="absolute inset-0 opacity-30">
                      <div className="absolute top-0 left-0 w-full h-1 bg-white animate-pulse"></div>
                      <div className="absolute top-2 left-0 w-full h-1 bg-white animate-pulse" style={{animationDelay:'0.2s'}}></div>
                    </div>
                  </div>
                  <div className="absolute inset-2 rounded-full flex items-center justify-center" style={{transform:m.status==='running'?`rotate(${m.timer*(m.rpm/10)}deg)`:'rotate(0deg)',transition:'transform 0.1s linear'}}>
                    {[...Array(12)].map((_,i)=><div key={i} className="absolute w-3 h-3 bg-gray-400 rounded-full opacity-40" style={{top:'50%',left:'50%',transform:`rotate(${i*30}deg) translateY(-30px)`}}></div>)}
                    <div className="w-8 h-8 bg-gray-500 rounded-full opacity-50"></div>
                  </div>
                  {m.phase==='washing'&&m.detergent&&[...Array(8)].map((_,i)=><div key={i} className="absolute bg-white rounded-full opacity-60 animate-bounce" style={{width:`${Math.random()*10+5}px`,height:`${Math.random()*10+5}px`,left:`${Math.random()*80+10}%`,bottom:`${Math.random()*60+20}%`,animationDelay:`${Math.random()*2}s`,animationDuration:`${Math.random()*2+1}s`}}></div>)}
                  {m.phase==='spinning'&&<div className="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-20 animate-spin"></div>}
                </div>
                <div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 flex gap-1">
                  <div className={`w-2 h-2 rounded-full ${m.status==='running'?'bg-green-400 animate-pulse':'bg-gray-400'}`}></div>
                  <div className={`w-2 h-2 rounded-full ${m.status==='complete'?'bg-blue-400 animate-pulse':'bg-gray-400'}`}></div>
                </div>
              </div>
            </div>
            <div className="mb-6">
              <div className="flex justify-between mb-2">
                <span className="text-sm font-semibold text-gray-700">Level Air</span>
                <span className="text-sm font-bold text-blue-600">{Math.round(m.waterLevel)}%</span>
              </div>
              <div className="h-8 bg-gray-200 rounded-full overflow-hidden relative">
                <div className="h-full bg-gradient-to-r from-blue-400 to-blue-600 transition-all duration-300 flex items-center justify-center" style={{width:`${m.waterLevel}%`}}>
                  {m.waterLevel>20&&<Droplets size={20} className="text-white animate-pulse"/>}
                </div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-4 mb-6">
              <div className="bg-gray-50 p-3 rounded-lg">
                <p className="text-xs text-gray-500 mb-1">Kecepatan Putar</p>
                <p className="text-xl font-bold text-gray-800">{Math.round(m.rpm)} RPM</p>
              </div>
              <div className="bg-gray-50 p-3 rounded-lg">
                <p className="text-xs text-gray-500 mb-1">Timer Fase</p>
                <p className="text-xl font-bold text-gray-800">{m.timer}s</p>
              </div>
            </div>
            <div className="flex gap-3 mb-6">
              <div className={`flex-1 p-3 rounded-lg ${m.detergent?'bg-purple-100':'bg-gray-100'}`}>
                <p className="text-xs text-gray-600">Detergen</p>
                <p className="font-bold text-sm">{m.detergent?'AKTIF':'OFF'}</p>
              </div>
              <div className={`flex-1 p-3 rounded-lg ${m.status==='running'?'bg-green-100':m.status==='complete'?'bg-blue-100':'bg-gray-100'}`}>
                <p className="text-xs text-gray-600">Status</p>
                <p className="font-bold text-sm uppercase">{m.status==='complete'?'SELESAI':m.status}</p>
              </div>
            </div>
            <div className="mb-6">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-semibold text-gray-600">Proses Siklus</span>
              </div>
              <div className="flex gap-1">
                {['filling','washing','draining','spinning'].map((p,i)=><div key={p} className={`flex-1 h-2 rounded ${['filling','washing','draining','spinning','complete'].indexOf(m.phase)>=i?phaseConfig[p].color:'bg-gray-200'}`} title={phaseConfig[p].text}></div>)}
              </div>
            </div>
            <div className="flex gap-3">
              {m.status==='idle'&&<button onClick={()=>startMachine(m.id)} disabled={autoMode} className="flex-1 bg-green-500 hover:bg-green-600 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors">START</button>}
              {m.status==='running'&&<button onClick={()=>stopMachine(m.id)} disabled={autoMode} className="flex-1 bg-red-500 hover:bg-red-600 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors">STOP</button>}
              {m.status==='complete'&&<button onClick={()=>stopMachine(m.id)} disabled={autoMode} className="flex-1 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors">RESET</button>}
            </div>
            {autoMode&&<div className="mt-4 bg-green-50 border border-green-200 rounded-lg p-3 flex items-center gap-2"><Play size={20}/><span className="text-sm text-green-800 font-semibold">Mode otomatis aktif - Kontrol manual dinonaktifkan</span></div>}
            {m.status==='complete'&&<div className="mt-4 bg-green-50 border border-green-200 rounded-lg p-3 flex items-center gap-2"><AlertCircle size={20}/><span className="text-sm text-green-800 font-semibold">Siklus pencucian selesai!</span></div>}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen p-6">
          <div className="mb-6 flex justify-between items-center flex-wrap gap-4">
            <div>
              <h1 className="text-4xl font-bold text-white mb-2">SCADA Monitoring System</h1>
              <p className="text-blue-200">Mesin Cuci Industri - 4 Unit Tabung</p>
            </div>
            <button onClick={()=>setAutoMode(!autoMode)} className={`${autoMode?'bg-red-500 hover:bg-red-600':'bg-green-500 hover:bg-green-600'} text-white font-bold py-3 px-6 rounded-lg shadow-lg flex items-center gap-2 transition-colors`}>
              {autoMode?<><Pause size={20}/>Stop Auto</>:<><Play size={20}/>Auto Mode</>}
            </button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <StatCard label="Mesin Aktif" value={`${systemStats.activeMachines}/4`} Icon={Power} gradient="from-blue-600 to-blue-700"/>
            <StatCard label="Total Siklus" value={systemStats.totalCycles} Icon={Droplets} gradient="from-cyan-600 to-cyan-700"/>
            <StatCard label="Pemakaian Air" value={`${systemStats.waterUsage}L`} Icon={Wind} gradient="from-teal-600 to-teal-700"/>
            <StatCard label="Mode Otomatis" value={autoMode?'AKTIF':'OFF'} Icon={autoMode?Play:Pause} gradient={autoMode?'from-green-600 to-green-700':'from-gray-600 to-gray-700'}/>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            {machines.map(m=><MachineCard key={m.id} m={m}/>)}
          </div>
          <div className="bg-white rounded-lg p-4 shadow-lg mb-6">
            <h3 className="font-bold text-gray-800 mb-3">Fase Proses:</h3>
            <div className="flex flex-wrap gap-4">
              {Object.entries(phaseConfig).filter(([k])=>k!=='idle'&&k!=='complete').map(([k,v])=>
                <div key={k} className="flex items-center gap-2">
                  <div className={`w-4 h-4 ${v.color} rounded`}></div>
                  <span className="text-sm text-gray-700">{v.text}</span>
                </div>
              )}
            </div>
          </div>
          <div className="bg-white rounded-xl shadow-2xl overflow-hidden">
            <div className="bg-gradient-to-r from-blue-600 to-blue-700 p-6 flex justify-between items-center flex-wrap gap-4">
              <div>
                <h2 className="text-2xl font-bold text-white mb-1">Laporan Operasional Mesin Cuci</h2>
                <p className="text-blue-100">Data Siklus Pencucian Real-time</p>
              </div>
              <div className="flex gap-3">
                <button onClick={clearReport} disabled={reportData.length===0} className="bg-red-500 hover:bg-red-600 disabled:bg-red-300 disabled:cursor-not-allowed text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm">Hapus Data</button>
                <button onClick={exportReport} disabled={reportData.length===0} className="bg-green-500 hover:bg-green-600 disabled:bg-green-300 disabled:cursor-not-allowed text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition-colors text-sm"><Download size={18}/>Export Word</button>
              </div>
            </div>
            <div className="p-6 bg-gray-50 border-b">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className="bg-white p-4 rounded-lg shadow">
                  <p className="text-sm text-gray-600 mb-1">Total Siklus</p>
                  <p className="text-2xl font-bold text-blue-600">{reportData.length}</p>
                </div>
                <div className="bg-white p-4 rounded-lg shadow">
                  <p className="text-sm text-gray-600 mb-1">Total Air</p>
                  <p className="text-2xl font-bold text-cyan-600">{reportData.reduce((a,r)=>a+r.waterUsed,0)} L</p>
                </div>
                <div className="bg-white p-4 rounded-lg shadow">
                  <p className="text-sm text-gray-600 mb-1">Rata-rata Durasi</p>
                  <p className="text-2xl font-bold text-green-600">{reportData.length>0?Math.round(reportData.reduce((a,r)=>a+r.duration,0)/reportData.length):0}s</p>
                </div>
                <div className="bg-white p-4 rounded-lg shadow">
                  <p className="text-sm text-gray-600 mb-1">Success Rate</p>
                  <p className="text-2xl font-bold text-purple-600">100%</p>
                </div>
              </div>
            </div>
            <div className="p-6 max-h-96 overflow-auto">
              {reportData.length===0?
                <div className="text-center py-12">
                  <FileText size={48} className="mx-auto text-gray-300 mb-4"/>
                  <p className="text-gray-500 text-lg">Belum ada data siklus pencucian</p>
                  <p className="text-gray-400 text-sm mt-2">Mulai mesin untuk mencatat data</p>
                </div>
              :
                <div className="overflow-x-auto">
                  <table className="w-full">
                    <thead className="sticky top-0 bg-white">
                      <tr className="bg-gray-100 border-b-2 border-gray-300">
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">No</th>
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">Mesin</th>
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">Waktu Selesai</th>
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">Air Digunakan</th>
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">Durasi</th>
                        <th className="px-4 py-3 text-left text-sm font-bold text-gray-700">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {reportData.map((r,i)=>
                        <tr key={r.id} className="border-b border-gray-200 hover:bg-blue-50 transition-colors">
                          <td className="px-4 py-3 text-sm text-gray-700">{i+1}</td>
                          <td className="px-4 py-3 text-sm font-semibold text-blue-600">Mesin #{r.machineId}</td>
                          <td className="px-4 py-3 text-sm text-gray-700">{r.timestamp}</td>
                          <td className="px-4 py-3 text-sm text-gray-700">{r.waterUsed} Liter</td>
                          <td className="px-4 py-3 text-sm text-gray-700">{r.duration} detik</td>
                          <td className="px-4 py-3 text-sm">
                            <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-semibold">{r.status}</span>
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              }
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
